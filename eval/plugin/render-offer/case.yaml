schema_version: "1.1"
name: render-offer
description: >
  rule:router-offer-render. A long spec with open questions gets a review-page offer at its
  acceptance Checkpoint; the agent neither starts the server nor records a decision unasked.
tags: [router, render]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 420
  allowed_tools: [Read, Glob, Grep, Bash, Skill]
  prompt: >
    /groundwork:groundwork spec docs/spec.md — the draft is written and the builder check is
    done. Take me to the acceptance checkpoint.
graders:
  - name: offers-review-page
    type: regex
    pattern: "groundwork render[^\\n]*docs/spec\\.md"
  - name: no-server-without-consent
    type: tool_used
    tool: Bash
    input_match: "--serve"
    min: 0
    max: 0
  - name: nothing-recorded
    type: tool_used
    tool: Bash
    input_match: "groundwork approve"
    min: 0
    max: 0
