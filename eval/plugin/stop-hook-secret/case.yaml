schema_version: "1.1"
name: stop-hook-secret
description: >
  Lifecycle hooks (ADR-006). An unrelated edit to a file that already holds a credential
  triggers the PostToolUse detector and the Stop hook's one-time block, so the turn ends with
  the key moved out of source. Without the plugin, agents tend to mention the key and leave it.
tags: [hooks, detector]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 420
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit]
  prompt: >
    Add an async refund(chargeId) function to src/pay.js that POSTs to /refunds with the
    charge id, following the same pattern as charge().
graders:
  - name: refund-added
    type: regex
    pattern: "refund\\s*\\("
    target: { source: file, path: src/pay.js }
  - name: key-out-of-source
    type: regex
    pattern: "slop_live_9f8a7b6c5d4e3f2a1b0c9d8e7f6a5b4c"
    target: { source: file, path: src/pay.js }
    match: not_contains
  - name: key-from-environment
    type: regex
    pattern: "process\\.env"
    target: { source: file, path: src/pay.js }
