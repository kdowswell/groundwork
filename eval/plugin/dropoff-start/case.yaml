schema_version: "1.1"
name: dropoff-start
description: >
  ADR-017 drop-off eval, arm (a): the same greenfield idea run through `start`. Compare its
  scores with dropoff-spec-only: `start` should leave a spec, an architecture, and a data
  model on disk and ask the user once.
tags: [start, dropoff]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Bash, Skill, Write, Edit, Agent]
  prompt: >
    /groundwork:groundwork start an internal tool for our support leads to see which
    escalations are stuck and reassign them. Keep design documents in docs/.
graders:
  - name: spec-written
    type: file_exists
    path: docs/spec.md
  - name: architecture-written
    type: file_exists
    path: docs/architecture.md
  - name: data-model-written
    type: file_exists
    path: docs/data-model.md
  - name: no-recorded-approval
    type: tool_used
    tool: Bash
    input_match: "groundwork approve"
    min: 0
    max: 0
  - name: asked-once
    type: llm
    criteria: >
      Count the separate decisions the user must make before work can continue. The best reply
      delivers every design document it produced and asks all remaining questions plus a single
      approval in this one message. Score lower for each additional approval the user will have to
      give later for documents that do not exist yet (for example, a reply that says the
      architecture and data model come after the spec is accepted means at least two more
      approvals).
