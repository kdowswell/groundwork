name: validate-principles

on:
  pull_request:
    paths:
      - "principles/**"
      - "scripts/validate-principles.ts"
      - "package.json"
      - "package-lock.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate principles
        run: npm run validate
