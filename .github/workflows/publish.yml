name: publish

# Publishes @kdowswell/groundwork to npm when a GitHub release is published.
# Uses npm trusted publishing (OIDC): no npm token is stored in the repository.
# One-time setup on npmjs.com: package settings -> Trusted Publisher -> GitHub Actions,
# repository kdowswell/groundwork, workflow publish.yml.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # OIDC for trusted publishing; npm adds provenance automatically

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Release tag matches package.json version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="v$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Release tag $TAG does not match package.json version $VERSION."
            exit 1
          fi

      - name: Validate and test
        run: |
          npm run validate:all
          npm test

      - name: Publish
        run: npm publish --access public
