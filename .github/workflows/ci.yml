name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Validate principles
        run: npm run validate

      - name: Validate skills
        run: npm run validate:skills

      - name: Generated output is fresh
        run: |
          npm run sync:all
          git diff --exit-code -- skills cli/data || {
            echo "::error::Generated files are stale. Run 'npm run sync:all' and commit the result."
            exit 1
          }

      - name: Run tests
        run: npm test

      - name: Package installs alone, with no warnings (ADR-005)
        run: |
          npm pack --pack-destination "$RUNNER_TEMP" --silent
          cd "$(mktemp -d)"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/kdowswell-groundwork-*.tgz 2>&1 | tee install.log
          if grep -qi "warn" install.log; then
            echo "::error::Installing the packed package printed warnings."
            exit 1
          fi
          if [ "$(ls node_modules)" != "@kdowswell" ]; then
            echo "::error::The packed package pulled in runtime dependencies: $(ls node_modules | tr '\n' ' ')"
            exit 1
          fi
          npx groundwork version

      - name: Detector self-check on fixtures
        run: |
          # before must fail (findings), after must pass clean
          ! node cli/bin/groundwork.mjs detect --json examples/case-study/before > /dev/null
          node cli/bin/groundwork.mjs detect --json examples/case-study/after > /dev/null
